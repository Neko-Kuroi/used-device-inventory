{% extends "base.html" %}
{% block title %}初期設定{% endblock %}
{% block body %}
<h1>初期設定</h1>
<p>最初の管理者を作成します。この画面は、ユーザーがまだ誰もいないときだけ表示されます。</p>
<form method="post">
  <label>ユーザー名</label>
  <input name="username" required>
  <label>パスワード（8文字以上）</label>
  <input name="password" type="password" required>
  <button type="submit">管理者を作成</button>
</form>
{% endblock %}
